<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SortWise Dashboard — Manage your waste profile and track your impact.">
  <title>Dashboard — SortWise</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script>
    // UI update based on session
    window.auth.checkAuthSession().then(session => {
      if (session) {
        document.getElementById('user-email').textContent = session.user.email;
        document.body.style.display = 'block';
      }
    });
  </script>
</head>
<body style="display: none;">

  <!-- ═══════════ NAVBAR ═══════════ -->
      <nav class="nav-links">
        <a href="Home.html">Home</a>
        <a href="#" class="btn btn-outline btn-sm nav-signout">Sign Out</a>
      </nav>
    </div>
  </header>

  <!-- ═══════════ DASHBOARD CONTENT ═══════════ -->
  <main class="dashboard" style="padding: 4rem 1.5rem;">
    <div class="container">
      <div class="card card-shadow-lg" style="max-width: 800px; margin: 0 auto; padding: 3rem; text-align: center;">
        <div class="success-icon" style="margin-bottom: 2rem; color: var(--primary);">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <h1 style="margin-bottom: 1rem;">Welcome to your Dashboard</h1>
        <p style="color: #6b7280; font-size: 1.125rem; margin-bottom: 2rem;">
          You are currently logged in as: <strong id="user-email" style="color: var(--fg);"></strong>
        </p>
        
        <div class="grid md-grid-cols-2 gap-4" style="text-align: left;">
          <div class="card card-shadow-sm" style="padding: 1.5rem; background: #f9fafb;">
            <h3 style="margin-bottom: 0.5rem;">Household Profile</h3>
            <p style="font-size: 0.875rem; color: #6b7280;">Manage your members and location settings.</p>
          </div>
          <div class="card card-shadow-sm" style="padding: 1.5rem; background: #f9fafb;">
            <h3 style="margin-bottom: 0.5rem;">Impact Stats</h3>
            <p style="font-size: 0.875rem; color: #6b7280;">View how much waste you've diverted from landfills.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BAE0DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.1 17 3.1s2.4 6 1.2 12.3A7 7 0 0 1 11 20z"/><path d="M11.7 7.5a4 4 0 0 0-1 8.7"/></svg>
        SortWise
      </div>
      <p class="footer-copy">&copy; 2026 SortWise Technologies. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
