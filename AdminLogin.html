<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SortWise Admin Login — Authorized access to the facility monitoring dashboard.">
  <title>Admin Login — SortWise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="Home.html" class="navbar-brand">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.1 17 3.1s2.4 6 1.2 12.3A7 7 0 0 1 11 20z"/><path d="M11.7 7.5a4 4 0 0 0-1 8.7"/></svg>
        Sort<span class="brand-highlight">Wise</span>
      </a>
        <a href="Home.html">Home</a>
        <a href="UserLogin.html">User Portal</a>
        <a href="AdminLogin.html">Admin Portal</a>
        <a href="#" class="btn btn-outline btn-sm nav-signout">Sign Out</a>
      </nav>
      <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
      <a href="Home.html">Home</a>
      <a href="UserLogin.html">User Portal</a>
      <a href="AdminLogin.html">Admin Portal</a>
      <a href="#" class="nav-signout">Sign Out</a>
    </div>
  </header>

  <!-- LOGIN CARD -->
  <main class="login-page login-page-admin">
    <div class="card login-card login-card-admin card-shadow-xl">
      <div class="login-gradient-bar"></div>

      <div class="login-header" style="padding-top: 3rem;">
        <div class="login-icon-box login-icon-admin">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h2>Admin Control Panel</h2>
        <p>Authorized personnel only</p>
      </div>

      <div class="login-body">
        <form class="login-form" id="admin-login-form">
          <div class="form-group">
            <label for="admin-id" class="form-label">Admin ID / Email</label>
            <input id="admin-id" name="admin-id" type="text" required class="form-input" placeholder="admin@municipality.gov">
          </div>

          <div class="form-group">
            <label for="admin-password" class="form-label">Security Key</label>
            <input id="admin-password" name="password" type="password" required class="form-input" placeholder="••••••••">
          </div>

          <button type="submit" class="btn btn-secondary w-full" style="height: 3rem; font-size: 1.125rem; margin-top: 0.5rem;">
            Authenticate
          </button>

          <div class="login-back">
            <a href="Home.html">Return to Home</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BAE0DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.1 17 3.1s2.4 6 1.2 12.3A7 7 0 0 1 11 20z"/><path d="M11.7 7.5a4 4 0 0 0-1 8.7"/></svg>
        SortWise
      </div>
      <p class="footer-copy">&copy; 2026 SortWise Technologies. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/script.js"></script>
  <script>
    const adminLoginForm = document.getElementById('admin-login-form');
    const submitBtn = adminLoginForm.querySelector('button[type="submit"]');

    adminLoginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('admin-id').value;
      const password = document.getElementById('admin-password').value;
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const { data, error, role } = await auth.signIn(email, password);
        
        if (error) {
          alert('Authentication Failed: ' + error.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Authenticate';
        } else if (!data.session) {
          alert('Access Pending: Please check your email and confirm your admin account.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Authenticate';
        } else {
          window.location.href = role === 'admin' ? 'AdminDashboard.html' : 'UserDashboard.html';
        }
      } catch (err) {
        console.error('Admin login crash:', err);
        alert('An unexpected error occurred. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Authenticate';
      }
    });
  </script>
</body>
</html>
